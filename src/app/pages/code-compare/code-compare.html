<div class="flex flex-col gap-4 p-4">
    <!-- Input panels: always visible -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="p-4 bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-border">
            <p-code-input side="left" />
        </div>
        <div class="p-4 bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-border">
            <p-code-input side="right" />
        </div>
    </div>

    @if (hasBothFiles()) {
        <p-diff-toolbar />
        <p-diff-summary />

        <!-- Diff viewer + minimap -->
        <div class="flex gap-3">
            <div class="flex-1 min-w-0">
                <p-diff-viewer />
            </div>
            <div class="w-14 shrink-0">
                <p-diff-minimap />
            </div>
        </div>

    } @else if (hasAnyFile()) {
        <div class="flex items-center justify-center p-4 text-surface-400 border border-dashed border-surface-200 dark:border-surface-700 rounded-border">
            <i class="pi pi-info-circle mr-2"></i>
            <span>Add code to the {{ state.leftFile() ? 'right (Code B)' : 'left (Code A)' }} panel to start comparing.</span>
        </div>
    }
</div>
