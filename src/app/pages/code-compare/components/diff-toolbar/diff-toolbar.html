<div class="flex flex-wrap items-center gap-4 px-5 py-3 bg-surface-0 dark:bg-surface-900 w-full transition-all">
    <!-- View mode -->
    <p-selectbutton [options]="viewOptions" optionLabel="label" optionValue="value" [ngModel]="viewMode()"
        (ngModelChange)="onViewModeChange($event)" size="small" styleClass="shadow-sm" />

    <div class="w-px h-8 bg-surface-200 dark:bg-surface-700 hidden sm:block mx-1 gap-2"></div>

    <!-- Ignore options -->
    <div class="flex flex-wrap items-center gap-4 text-sm font-medium text-surface-700 dark:text-surface-300">
        <label class="flex items-center gap-2 cursor-pointer hover:text-primary transition-colors">
            <p-checkbox [binary]="true" [ngModel]="options().ignoreWhitespace"
                (ngModelChange)="state.updateOptions({ ignoreWhitespace: $event })" inputId="ignoreWS" />
            <span>Ignore whitespace</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-primary transition-colors">
            <p-checkbox [binary]="true" [ngModel]="options().ignoreCase"
                (ngModelChange)="state.updateOptions({ ignoreCase: $event })" inputId="ignoreCase" />
            <span>Ignore case</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-primary transition-colors">
            <p-checkbox [binary]="true" [ngModel]="options().ignoreBlankLines"
                (ngModelChange)="state.updateOptions({ ignoreBlankLines: $event })" inputId="ignoreBlank" />
            <span>Ignore blank lines</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer hover:text-primary transition-colors">
            <p-checkbox [binary]="true" [ngModel]="options().wordDiff"
                (ngModelChange)="state.updateOptions({ wordDiff: $event })" inputId="wordDiff" />
            <span>Word diff</span>
        </label>
    </div>

    <div class="w-px h-8 bg-surface-200 dark:bg-surface-700 hidden xl:block mx-1"></div>

    <!-- Navigation -->
    <div
        class="flex items-center gap-2 bg-surface-50 dark:bg-surface-800 p-1 rounded-lg border border-surface-200 dark:border-surface-700">
        <p-button icon="pi pi-angle-up" severity="secondary" [text]="true" size="small" (onClick)="prevDiff()"
            pTooltip="Previous diff (Alt+↑)" tooltipPosition="top" aria-label="Previous diff" />
        @if (diffResult()) {
        <span class="text-xs font-bold text-surface-600 dark:text-surface-300 px-2 min-w-[3rem] text-center font-mono">
            {{ currentDiffIndex() + 1 }}/{{ totalDiffBlocks() }} </span>
        }
        <p-button icon="pi pi-angle-down" severity="secondary" [text]="true" size="small" (onClick)="nextDiff()"
            pTooltip="Next diff (Alt+↓)" tooltipPosition="top" aria-label="Next diff" />
    </div>

    <div class="w-px h-8 bg-surface-200 dark:bg-surface-700 hidden 2xl:block mx-1"></div>

    <!-- Search -->
    <p-iconfield styleClass="shadow-sm">
        <p-inputicon class="pi pi-search text-surface-400" />
        <input pInputText type="text" size="small" placeholder="Search... (Ctrl+F)" [value]="searchQuery()"
            (input)="onSearch($event)" class="!text-sm rounded-lg" style="width: 180px" aria-label="Search in diff" />
    </p-iconfield>

    @if (searchState().matchIndices.length > 0) {
    <span class="text-xs font-bold bg-primary/10 text-primary px-2 py-1 rounded-md mt-1 xl:mt-0 font-mono"> {{
        searchState().currentMatchIndex + 1 }}/{{ searchState().matchIndices.length }} </span>
    }

    <div class="ml-auto flex items-center gap-3">
        <!-- Export -->
        <p-button icon="pi pi-file-export" label="Export HTML" severity="secondary" [outlined]="true" size="small"
            (onClick)="onExportHtml()" pTooltip="Download diff as self-contained HTML file" tooltipPosition="top"
            styleClass="rounded-lg bg-surface-50 dark:bg-surface-800 border-surface-200 dark:border-surface-700 hover:border-primary hidden md:inline-flex" />
        <p-button icon="pi pi-image" [label]="imageLabel()" severity="secondary" [outlined]="true" size="small"
            (onClick)="onExportImage()" [loading]="imageStatus() === 'exporting'" pTooltip="Download diff as PNG image"
            tooltipPosition="top"
            styleClass="rounded-lg bg-surface-50 dark:bg-surface-800 border-surface-200 dark:border-surface-700 hover:border-primary hidden xl:inline-flex" />

        <div class="w-px h-6 bg-surface-200 dark:bg-surface-700 hidden md:block"></div>

        <!-- Swap & Clear -->
        <p-button icon="pi pi-arrows-h" label="Swap" severity="secondary" [text]="true" size="small"
            (onClick)="state.swapFiles()" pTooltip="Swap left and right"
            styleClass="font-bold hover:bg-surface-100 dark:hover:bg-surface-800" />
        <p-button icon="pi pi-times" label="Clear" severity="danger" [text]="true" size="small"
            (onClick)="state.clearAll()" pTooltip="Clear all and start over"
            styleClass="font-bold hover:bg-red-50 dark:hover:bg-red-900/20" />
    </div>
</div>

<p-toast position="bottom-right" />
