@if (summary()) {
<div class="flex flex-col lg:flex-row flex-wrap items-center justify-between gap-4 p-4 md:px-6 md:py-3 w-full text-sm">
    <div class="flex flex-wrap items-center justify-center lg:justify-start gap-4 flex-1 w-full lg:w-auto">

        <!-- Match Progress -->
        <div
            class="flex items-center gap-3 font-semibold text-surface-700 dark:text-surface-200 shadow-sm bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 px-4 py-2 rounded-lg">
            <div
                class="w-24 md:w-32 h-2.5 bg-surface-200 dark:bg-surface-700 rounded-full overflow-hidden shadow-inner flex">
                <div class="h-full bg-gradient-to-r from-green-400 to-emerald-500 rounded-full transition-all"
                    [style.width.%]="summary()!.similarityPercent"></div>
            </div>
            <span class="font-mono text-xs w-[65px] text-right">{{ summary()!.similarityPercent }}% match</span>
        </div>

        <div class="w-px h-8 bg-surface-200 dark:bg-surface-700 hidden sm:block mx-1"></div>

        <!-- Fine-grained counts -->
        <div
            class="flex flex-wrap items-center gap-2 sm:gap-4 bg-surface-0 dark:bg-surface-900 py-1.5 px-3 rounded-lg border border-surface-200 dark:border-surface-700 shadow-sm font-mono text-xs">
            <span
                class="inline-flex items-center gap-1 hover:bg-green-100 dark:hover:bg-green-900/50 px-2 py-1 rounded tracking-wider font-bold transition-colors text-green-600 dark:text-green-400"
                pTooltip="Additions" tooltipPosition="top">
                <i class="pi pi-plus text-[10px]"></i> {{ summary()!.totalAdded }}
            </span>
            <div class="w-px h-4 bg-surface-200 dark:bg-surface-700 hidden sm:block"></div>
            <span
                class="inline-flex items-center gap-1 hover:bg-red-100 dark:hover:bg-red-900/50 px-2 py-1 rounded tracking-wider font-bold transition-colors text-red-600 dark:text-red-400"
                pTooltip="Deletions" tooltipPosition="top">
                <i class="pi pi-minus text-[10px]"></i> {{ summary()!.totalRemoved }}
            </span>
            <div class="w-px h-4 bg-surface-200 dark:bg-surface-700 hidden sm:block"></div>
            <span
                class="inline-flex items-center gap-1 hover:bg-amber-100 dark:hover:bg-amber-900/50 px-2 py-1 rounded tracking-wider font-bold transition-colors text-amber-600 dark:text-amber-400"
                pTooltip="Modified" tooltipPosition="top">
                <i class="pi pi-refresh text-[10px]"></i> {{ summary()!.totalModified }}
            </span>
            <div class="w-px h-4 bg-surface-200 dark:bg-surface-700 hidden sm:block"></div>
            <span
                class="inline-flex items-center gap-1 hover:bg-surface-200 dark:hover:bg-surface-700 px-2 py-1 rounded tracking-wider font-bold transition-colors text-surface-500 dark:text-surface-400"
                pTooltip="Unchanged" tooltipPosition="top">
                <i class="pi pi-check text-[10px]"></i> {{ summary()!.totalUnchanged }}
            </span>
        </div>
    </div>


    <div class="flex flex-wrap items-center justify-center lg:justify-end gap-4 flex-1 w-full lg:w-auto mt-2 lg:mt-0">
        @if (summary()!.totalUnchanged > 0) {
        <p-button [icon]="showAllUnchanged() ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [label]="showAllUnchanged() ? 'Hide Matches' : 'Show Matches'" severity="secondary" [outlined]="true"
            size="small" (onClick)="state.toggleShowAllUnchanged()"
            [pTooltip]="showAllUnchanged() ? 'Collapse unchanged lines' : 'Expand all unchanged lines'"
            tooltipPosition="top"
            styleClass="font-bold tracking-tight rounded-lg shadow-sm bg-surface-0 dark:bg-surface-900 border-surface-200 dark:border-surface-700 hover:border-primary" />
        }

        <div class="w-px h-8 bg-surface-200 dark:bg-surface-700 hidden sm:block mx-1"></div>

        <!-- Font size control -->
        <div
            class="flex items-center gap-1 bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-lg p-1 shadow-sm">
            <p-button icon="pi pi-minus" severity="secondary" [text]="true" size="small"
                (onClick)="state.decreaseFontSize()" [disabled]="state.fontSize() <= 10" pTooltip="Decrease font size"
                tooltipPosition="top" aria-label="Decrease font size" styleClass="w-6 h-6 p-0" />
            <span
                class="text-xs text-surface-700 dark:text-surface-300 w-12 text-center font-mono font-bold select-none">{{
                state.fontSize() }}px</span>
            <p-button icon="pi pi-plus" severity="secondary" [text]="true" size="small"
                (onClick)="state.increaseFontSize()" [disabled]="state.fontSize() >= 22" pTooltip="Increase font size"
                tooltipPosition="top" aria-label="Increase font size" styleClass="w-6 h-6 p-0" />
        </div>

        <div
            class="font-mono text-xs font-bold text-surface-400 dark:text-surface-500 bg-surface-0 dark:bg-surface-900 px-3 py-1.5 rounded-lg border border-surface-200 dark:border-surface-700 hidden xl:block shadow-sm">
            Total: {{ summary()!.total }}</div>
    </div>
</div>
}
