<div class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto">
    <!-- ===== HEADER ===== -->
    <div class="text-center flex flex-col items-center justify-center mb-2">
        <h1 class="text-2xl sm:text-3xl font-bold text-surface-900 dark:text-white m-0 mb-2 tracking-tight">Dummy File Generator</h1>
    </div>

    <!-- ===== GENERATOR FORM ===== -->
    <div class="card p-0 border border-surface-200 dark:border-surface-700 shadow-none rounded-2xl overflow-hidden">
        <div class="p-6 sm:p-8 bg-surface-0 dark:bg-surface-900">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- File Type Selection -->
                <div class="flex flex-col gap-2">
                    <label htmlFor="fileType" class="font-medium text-surface-900 dark:text-surface-0">Format</label>
                    <p-select id="fileType" [options]="fileTypes" [(ngModel)]="selectedFileType" optionLabel="label"
                        optionValue="value" placeholder="Select a File Type" styleClass="w-full">
                        <ng-template let-file pTemplate="item">
                            <div class="flex items-center gap-2">
                                <i class="pi" [ngClass]="{
                                    'pi-file-pdf text-red-500': file.value === 'pdf',
                                    'pi-image text-blue-500': file.value === 'jpg' || file.value === 'png',
                                    'pi-code text-orange-500': file.value === 'html' || file.value === 'json',
                                    'pi-file-excel text-green-500': file.value === 'csv',
                                    'pi-file text-surface-500': file.value === 'txt' || file.value === 'log'
                                }"></i>
                                <span>{{ file.label }}</span>
                            </div>
                        </ng-template>
                    </p-select>
                </div>

                <!-- File Size Input -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label htmlFor="fileSize" class="font-medium text-surface-900 dark:text-surface-0">Size (MB)</label>
                    </div>
                    <div class="flex gap-4 items-center">
                        <p-inputNumber id="fileSize" [(ngModel)]="fileSizeInMb" [min]="1" [max]="500" [showButtons]="true"
                            buttonLayout="horizontal" spinnerMode="horizontal" decrementButtonClass="p-button-secondary"
                            incrementButtonClass="p-button-secondary" incrementButtonIcon="pi pi-minus"
                            decrementButtonIcon="pi pi-plus" inputId="horizontal" styleClass="w-full"
                            class="flex-1"></p-inputNumber>
                        <div class="flex items-center gap-2">
                            <p-checkbox [(ngModel)]="addRandomNoise" [binary]="true" inputId="randomNoise"></p-checkbox>
                            <label for="randomNoise" class="text-sm font-medium text-surface-700 dark:text-surface-300 whitespace-nowrap"
                                pTooltip="Appends a unique UUID hash to bypass deduplication filters" tooltipPosition="top">Random Noise</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- JSON Schema Builder (Only visible when JSON is selected) -->
            <div *ngIf="selectedFileType === 'json'" class="flex flex-col gap-4 mt-6 p-4 border border-surface-200 dark:border-surface-700 rounded-xl bg-surface-50 dark:bg-surface-900/50">
                <div class="flex justify-between items-center">
                    <label class="font-medium text-surface-900 dark:text-surface-0 flex items-center gap-2">
                        JSON Schema Properties
                    </label>
                    <button pButton pRipple icon="pi pi-plus" label="Add Field" size="small" outlined (click)="addJsonField()"></button>
                </div>
                
                <div class="flex flex-col gap-3">
                    <div *ngFor="let field of jsonSchema; let i = index" class="flex items-center gap-3 bg-surface-0 dark:bg-surface-800 p-2 rounded-lg border border-surface-200 dark:border-surface-700">
                        <div class="flex-grow flex items-center gap-3">
                            <input pInputText [(ngModel)]="field.name" placeholder="Field Name" class="flex-grow" />
                            <p-select [options]="[
                                {label: 'String', value: 'string'}, 
                                {label: 'Number', value: 'number'}, 
                                {label: 'Boolean', value: 'boolean'},
                                {label: 'UUID', value: 'uuid'}
                            ]" [(ngModel)]="field.type" optionLabel="label" optionValue="value" class="w-32"></p-select>
                        </div>
                        <button pButton pRipple icon="pi pi-trash" severity="danger" text rounded (click)="removeJsonField(i)" [disabled]="jsonSchema.length === 1"></button>
                    </div>
                </div>
            </div>

            <!-- Padding Editor (Hidden when JSON is selected) -->
            <div *ngIf="selectedFileType !== 'json'" class="flex flex-col gap-2 mt-6">
                <label class="font-medium text-surface-900 dark:text-surface-0 flex items-center gap-2">
                    File Content (Padding)
                </label>
                <div class="border border-surface-200 dark:border-surface-700 rounded-lg overflow-hidden">
                    <p-editor [(ngModel)]="sampleText" [style]="{ height: '150px' }">
                        <ng-template pTemplate="header">
                            <span class="ql-formats">
                                <button class="ql-bold" aria-label="Bold"></button>
                                <button class="ql-italic" aria-label="Italic"></button>
                                <button class="ql-underline" aria-label="Underline"></button>
                                <button class="ql-strike" aria-label="Strike"></button>
                            </span>
                            <span class="ql-formats">
                                <select class="ql-color" aria-label="Text Color"></select>
                                <select class="ql-background" aria-label="Background Color"></select>
                            </span>
                            <span class="ql-formats">
                                <button class="ql-list" value="ordered" aria-label="Ordered List"></button>
                                <button class="ql-list" value="bullet" aria-label="Unordered List"></button>
                                <select class="ql-align" aria-label="Text Alignment"></select>
                            </span>
                            <span class="ql-formats">
                                <button class="ql-link" aria-label="Insert Link"></button>
                                <button class="ql-code-block" aria-label="Insert Code Block"></button>
                            </span>
                            <span class="ql-formats">
                                <button class="ql-clean" aria-label="Remove Styles"></button>
                            </span>
                        </ng-template>
                    </p-editor>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="flex-col">
            <p-progressBar *ngIf="isGenerating" [value]="progressValue" [showValue]="false" class="w-full" [style]="{'height': '4px'}"></p-progressBar>
            
            <div class="p-4 sm:px-8 border-t border-surface-200 dark:border-surface-700 bg-surface-50 dark:bg-surface-900 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="text-sm text-surface-600 dark:text-surface-400 font-mono">
                    Output: <span class="font-bold text-primary">dummy_{{fileSizeInMb}}mb.{{selectedFileType}}</span>
                </div>

                <div class="flex items-center gap-4 w-full sm:w-auto">
                    <span *ngIf="isGenerating" class="text-sm text-surface-500 font-medium">{{progressValue | number:'1.0-0'}}%</span>
                    <button pButton pRipple (click)="generateFile()" [loading]="isGenerating"
                        class="w-full sm:w-auto p-button-primary px-6 transition-colors">
                        <i class="pi pi-download mr-2" *ngIf="!isGenerating"></i>
                        <span class="font-semibold">{{ isGenerating ? 'Generating...' : 'Download' }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<p-toast></p-toast>
