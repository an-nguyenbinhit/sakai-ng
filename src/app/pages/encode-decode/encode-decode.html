<div class="flex flex-col gap-4 p-3 sm:p-4 md:p-6 animate-fadein">
    <p-toast></p-toast>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 w-full">
        <!-- Input Panel -->
        <div class="flex flex-col bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden group">
            <div class="flex items-center justify-between p-4 border-b border-surface-100 dark:border-surface-800 bg-surface-50 dark:bg-surface-800/50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                        <i class="pi pi-pencil"></i>
                    </div>
                    <span class="font-bold text-base text-surface-900 dark:text-surface-0">Source Text</span>
                </div>
                <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (click)="clearInputs()" pTooltip="Clear Workspace" tooltipPosition="left" class="opacity-0 group-hover:opacity-100 transition-opacity"></p-button>
            </div>

            <div class="p-4 flex-1 flex flex-col gap-4">
                <textarea
                    pTextarea
                    [(ngModel)]="inputString"
                    placeholder="Type or paste your text here..."
                    class="w-full flex-1 min-h-[180px] sm:min-h-[240px] md:min-h-[300px] resize-none border-0 bg-transparent focus:ring-0 text-surface-700 dark:text-surface-200 font-mono text-sm sm:text-base leading-relaxed p-0 transition-colors"
                    style="box-shadow: none"
                ></textarea>

                <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-3 border-t border-surface-200 dark:border-surface-700 border-dashed">
                    <p-selectbutton [options]="operations" [(ngModel)]="operation" optionLabel="label" optionValue="value" styleClass="w-full sm:w-auto [&_.p-togglebutton]:flex-1"></p-selectbutton>

                    <div class="flex gap-2">
                        <p-button label="Encode" icon="pi pi-angle-double-right" (click)="encode()" styleClass="flex-1 sm:flex-none font-bold relative overflow-hidden"></p-button>
                        <p-button label="Decode" icon="pi pi-angle-double-down" severity="secondary" (click)="decode()" styleClass="flex-1 sm:flex-none" [outlined]="true"></p-button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="flex flex-col bg-surface-50 dark:bg-surface-900/80 border border-surface-200 dark:border-surface-700 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden group">
            <div class="flex items-center justify-between p-4 border-b border-surface-200 dark:border-surface-800">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/40 text-green-600 dark:text-green-400 flex items-center justify-center">
                        <i class="pi pi-check-circle"></i>
                    </div>
                    <span class="font-bold text-base text-surface-900 dark:text-surface-0">Result</span>
                </div>

                <!-- Badge indicating current operation -->
                <div class="px-3 py-1 rounded-full bg-surface-200 dark:bg-surface-700 text-surface-600 dark:text-surface-300 text-xs font-semibold tracking-wider uppercase">{{ operation() }}</div>
            </div>

            <div class="p-4 flex-1 flex flex-col relative">
                @if (outputString()) {
                <textarea
                    pTextarea
                    [ngModel]="outputString()"
                    readonly
                    class="w-full flex-1 min-h-[180px] sm:min-h-[240px] md:min-h-[300px] resize-none border-0 bg-transparent focus:ring-0 text-surface-700 dark:text-surface-200 font-mono text-sm sm:text-base leading-relaxed p-0 selection:bg-primary selection:text-primary-contrast"
                    style="box-shadow: none"
                ></textarea>

                <!-- Floating copy button -->
                <div class="absolute bottom-4 right-4 z-10 animate-fadeinup">
                    <p-button label="Copy Result" icon="pi pi-copy" severity="success" (click)="copyToClipboard()" [rounded]="true" styleClass="shadow-lg hover:scale-105 transition-transform text-sm"></p-button>
                </div>
                } @else {
                <!-- Empty state placeholder -->
                <div class="flex-1 flex flex-col items-center justify-center text-surface-400 dark:text-surface-500 min-h-[180px] sm:min-h-[240px] md:min-h-[300px] animate-fadein">
                    <i class="pi pi-box text-5xl sm:text-6xl mb-3 opacity-50"></i>
                    <p class="text-base sm:text-lg">Generated output will appear here</p>
                </div>
                }
            </div>
        </div>
    </div>
</div>
