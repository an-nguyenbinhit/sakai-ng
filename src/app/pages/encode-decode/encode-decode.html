<div class="flex flex-col gap-6 p-4 md:p-8 animate-fadein">
    <!-- Header Section with Gradient -->
    <div
        class="flex flex-col items-center justify-center p-8 bg-gradient-to-br from-indigo-500/10 via-purple-500/10 to-pink-500/10 dark:from-indigo-400/20 dark:via-purple-400/20 dark:to-pink-400/20 rounded-3xl border border-surface-200 dark:border-surface-700 backdrop-blur-sm shadow-sm transition-all hover:shadow-md"
    >
        <div class="bg-primary/10 text-primary w-16 h-16 rounded-full flex items-center justify-center mb-4 shadow-inner">
            <i class="pi pi-code text-3xl"></i>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-surface-900 dark:text-surface-0 tracking-tight mb-2 text-center">Encode <span class="text-primary font-light">&</span> Decode</h1>
        <p class="text-surface-600 dark:text-surface-400 max-w-xl text-center text-lg leading-relaxed">Instantly convert strings between Base64, URL, and HTML entity formats with visual clarity.</p>
    </div>

    <p-toast></p-toast>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full h-full relative">
        <!-- Input Panel -->
        <div class="flex flex-col bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-3xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden group">
            <div class="flex items-center justify-between p-5 border-b border-surface-100 dark:border-surface-800 bg-surface-50 dark:bg-surface-800/50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center">
                        <i class="pi pi-pencil"></i>
                    </div>
                    <span class="font-bold text-lg text-surface-900 dark:text-surface-0">Source Text</span>
                </div>
                <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (click)="clearInputs()" pTooltip="Clear Workspace" tooltipPosition="left" class="opacity-0 group-hover:opacity-100 transition-opacity"></p-button>
            </div>

            <div class="p-5 flex-1 flex flex-col">
                <textarea
                    pTextarea
                    [(ngModel)]="inputString"
                    placeholder="Type or paste your text here..."
                    class="w-full flex-1 min-h-[300px] resize-none border-0 bg-transparent focus:ring-0 text-surface-700 dark:text-surface-200 font-mono text-base leading-relaxed p-0 mb-4 transition-colors"
                    style="box-shadow: none"
                ></textarea>

                <div class="flex flex-wrap lg:flex-nowrap items-center justify-between gap-4 mt-auto pt-4 border-t border-surface-200 dark:border-surface-700 border-dashed">
                    <p-selectbutton [options]="operations" [(ngModel)]="operation" optionLabel="label" optionValue="value" styleClass="w-full lg:w-auto [&_.p-togglebutton]:flex-1"></p-selectbutton>

                    <div class="flex gap-2 w-full lg:w-auto">
                        <p-button label="Encode" icon="pi pi-angle-double-right" (click)="encode()" styleClass="w-full lg:w-auto font-bold relative overflow-hidden"></p-button>
                        <p-button label="Decode" icon="pi pi-angle-double-down" severity="secondary" (click)="decode()" styleClass="w-full lg:w-auto" [outlined]="true"></p-button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="flex flex-col bg-surface-50 dark:bg-surface-900/80 border border-surface-200 dark:border-surface-700 rounded-3xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden group">
            <div class="flex items-center justify-between p-5 border-b border-surface-200 dark:border-surface-800">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/40 text-green-600 dark:text-green-400 flex items-center justify-center">
                        <i class="pi pi-check-circle"></i>
                    </div>
                    <span class="font-bold text-lg text-surface-900 dark:text-surface-0">Result</span>
                </div>

                <!-- Badge indicating current operation -->
                <div class="px-3 py-1 rounded-full bg-surface-200 dark:bg-surface-700 text-surface-600 dark:text-surface-300 text-xs font-semibold tracking-wider uppercase">{{ operation() }}</div>
            </div>

            <div class="p-5 flex-1 flex flex-col relative">
                @if (outputString()) {
                <textarea
                    pTextarea
                    [ngModel]="outputString()"
                    readonly
                    class="w-full flex-1 min-h-[300px] resize-none border-0 bg-transparent focus:ring-0 text-surface-700 dark:text-surface-200 font-mono text-base leading-relaxed p-0 selection:bg-primary selection:text-primary-contrast"
                    style="box-shadow: none"
                ></textarea>

                <!-- Floating copy button -->
                <div class="absolute bottom-5 right-5 z-10 animate-fadeinup">
                    <p-button label="Copy Result" icon="pi pi-copy" severity="success" (click)="copyToClipboard()" [rounded]="true" styleClass="shadow-lg hover:scale-105 transition-transform"></p-button>
                </div>
                } @else {
                <!-- Empty state placeholder -->
                <div class="flex-1 flex flex-col items-center justify-center text-surface-400 dark:text-surface-500 min-h-[300px] animate-fadein">
                    <i class="pi pi-box text-6xl mb-4 opacity-50"></i>
                    <p class="text-lg">Generated output will appear here</p>
                </div>
                }
            </div>
        </div>
    </div>
</div>
