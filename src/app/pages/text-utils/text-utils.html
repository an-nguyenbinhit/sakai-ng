<p-toast></p-toast>

<app-tool-page-shell
    eyebrow="Convert & Transform"
    title="Text Utils"
    description="Clean up text quickly with case transforms, line tools, and slug generation while keeping character, word, and line counts visible."
    [badges]="['Phase 1', 'Offline-ready']"
    [stats]="shellStats()"
>
    <div tool-actions class="workspace-toolbar">
        <div class="toolbar-group">
            <button pButton type="button" label="UPPER" severity="secondary" outlined="true" (click)="apply('upper')"></button>
            <button pButton type="button" label="lower" severity="secondary" outlined="true" (click)="apply('lower')"></button>
            <button pButton type="button" label="Title Case" severity="secondary" outlined="true" (click)="apply('title')"></button>
            <button pButton type="button" label="Slugify" severity="secondary" outlined="true" (click)="apply('slugify')"></button>
        </div>
        <div class="toolbar-group">
            <button pButton type="button" label="Trim lines" severity="secondary" outlined="true" (click)="apply('trim')"></button>
            <button pButton type="button" label="Dedupe lines" severity="secondary" outlined="true" (click)="apply('dedupe')"></button>
            <button pButton type="button" label="Sort A-Z" severity="secondary" outlined="true" (click)="apply('sort-asc')"></button>
            <button pButton type="button" label="Sort Z-A" severity="secondary" outlined="true" (click)="apply('sort-desc')"></button>
            <button pButton type="button" label="Remove blanks" severity="secondary" outlined="true" (click)="apply('blank')"></button>
        </div>
        <div class="toolbar-group">
            <label class="file-button">
                <input type="file" accept=".txt,.csv,.md,.log,.json" (change)="importFile($event)" />
                <span>Import text</span>
            </label>
            <button pButton type="button" icon="pi pi-refresh" label="Reset output" severity="secondary" outlined="true" (click)="reset()"></button>
            <button pButton type="button" icon="pi pi-arrow-right" label="Use output as input" severity="secondary" outlined="true" (click)="useOutputAsInput()"></button>
            <button pButton type="button" icon="pi pi-copy" label="Copy output" severity="contrast" (click)="copyOutput()"></button>
            <button pButton type="button" icon="pi pi-download" label="Download" severity="secondary" outlined="true" (click)="downloadOutput()"></button>
        </div>
    </div>

    <section class="workspace-grid">
        <article class="workspace-panel">
            <header class="panel-header">
                <div>
                    <p>Input</p>
                    <h2>Source text</h2>
                </div>
                <span>{{ inputMetrics().lines }} lines · {{ inputMetrics().words }} words · {{ inputMetrics().chars }} chars</span>
            </header>
            <textarea pTextarea [ngModel]="inputText()" (ngModelChange)="inputText.set($event)" rows="18" class="workspace-textarea"></textarea>
        </article>

        <article class="workspace-panel">
            <header class="panel-header">
                <div>
                    <p>Output</p>
                    <h2>Transformed text</h2>
                </div>
                <span>{{ outputMetrics().lines }} lines · {{ outputMetrics().words }} words · {{ outputMetrics().chars }} chars</span>
            </header>
            <textarea pTextarea [ngModel]="outputText()" rows="18" class="workspace-textarea" readonly></textarea>
        </article>
    </section>
</app-tool-page-shell>
