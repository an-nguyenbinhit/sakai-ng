name: Build & Deploy to DevWorkspace

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base-href /DevWorkspace/

      - name: Deploy to DevWorkspace repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: an-nguyenbinhit/DevWorkspace
          publish_branch: main
          publish_dir: ./dist/sakai-ng/browser
          commit_message: "deploy: ${{ github.sha }}"
